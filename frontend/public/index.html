<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Viewport configured to strictly prevent auto-zoom on input focus and prevent bottom safe-area lift -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Staytup</title>

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Staytup" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />

    <!-- React Native Web Reset & Outline / Zoom Elimination -->
    <style id="staytup-pwa-styles">
      html, body {
        height: 100%;
        height: 100dvh;
        min-height: 100dvh;
        background-color: #000000;
        color: #ffffff;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        width: 100%;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        min-height: 100dvh;
        width: 100%;
        flex: 1;
        background-color: #000000;
      }
      /* Prevent mobile tap highlight and completely eliminate focus outline */
      input, textarea, select {
        outline: none !important;
        -webkit-tap-highlight-color: transparent !important;
        box-shadow: none !important;
      }
      input:focus, textarea:focus, select:focus, button:focus, *:focus {
        outline: none !important;
        box-shadow: none !important;
      }
      /* Ensure search modal placeholder uses the refined smaller font size */
      input[aria-label="Search input"]::placeholder,
      input[aria-label="Search input"]::-webkit-input-placeholder {
        font-size: 12px !important;
        letter-spacing: 0.1px !important;
        color: #888888 !important;
        opacity: 1 !important;
      }
      ::selection {
        background-color: #1DB954;
        color: #000000;
      }

      /* ── Native HTML Splash Screen ── */
      #staytup-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transition: opacity 0.35s ease-out;
      }
      #staytup-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #staytup-splash img {
        width: 220px;
        max-width: 70vw;
        animation: splashPop 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
      }
      @keyframes splashPop {
        from { opacity: 0; transform: scale(0.88); }
        to   { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>

  <body>
    <noscript>
      Staytup requires JavaScript to stream music.
    </noscript>

    <!-- Instant splash: visible before ANY JS runs -->
    <div id="staytup-splash">
      <img src="/staytup_logo.png" alt="Staytup" />
    </div>

    <div id="root"></div>

    <!-- Register PWA Service Worker & Install Prompt -->
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPWAInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }

      // Hide the HTML splash once React has rendered (MutationObserver watches #root)
      (function() {
        var splash = document.getElementById('staytup-splash');
        if (!splash) return;
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            observer.disconnect();
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 380);
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: false });
        // Safety: always remove after 6s even if React never mounts
        setTimeout(function() {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 380);
        }, 6000);
      })();
    </script>
  </body>
</html>
