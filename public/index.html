      /* Prevent mobile tap highlight and completely eliminate focus outline */
      input, textarea, select {

      input:focus, textarea:focus, select:focus, button:focus, *:focus {

        background-color: #1DB954;

      /* ── Native HTML Splash Screen ── */
      #staytup-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transition: opacity 0.35s ease-out;
      }
      #staytup-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      #staytup-splash img {
        width: 220px;
        max-width: 70vw;
        height: auto;
        animation: splashPop 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
      }
      .splash-spinner {
        width: 30px;
        height: 30px;
        border: 2.5px solid rgba(255, 255, 255, 0.12);
        border-top-color: #1DB954;
        border-radius: 50%;
        animation: splashSpin 0.75s linear infinite;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes splashPop {
        from { opacity: 0; transform: scale(0.88); }
        to   { opacity: 1; transform: scale(1); }
      }

    <noscript>

    <!-- Instant splash: visible before ANY JS runs -->
    <div id="staytup-splash">

    <div id="root"></div>

    <!-- Register PWA Service Worker & Install Prompt -->
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPWAInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // Dist upload chunk recovery (reloads fresh bundle if stale chunk is encountered)
      window.addEventListener('error', function(e) {
        var m = (e && e.message) || '';
        if (/Loading chunk [\d]+ failed|Failed to fetch dynamically imported module/i.test(m)) {
          if (!sessionStorage.getItem('staytup_dist_reload')) {
            sessionStorage.setItem('staytup_dist_reload', '1');
            window.location.reload();
          }
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            if (reg) {
              reg.update();
            }
          }).catch(function() {});
        });
      }

      // Handle bfcache (Back-Forward Cache) page restoration gracefully
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) {
          window.dispatchEvent(new CustomEvent('staytup-bfcache-resume'));
        }
      });

      // Hide the HTML splash once React has rendered (MutationObserver watches #root)
      (function() {
        var splash = document.getElementById('staytup-splash');
        if (!splash) return;
        function dismissSplash() {
          if (!splash || splash.classList.contains('hidden')) return;
          splash.classList.add('hidden');
          setTimeout(function() {
            try { splash.remove(); } catch(_) {}
          }, 360);
        }
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            observer.disconnect();
            dismissSplash();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });

        var pollTimer = setInterval(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearInterval(pollTimer);
            dismissSplash();
          }
        }, 100);

        // Safety: always remove after 1.2s max so user never sees a long black screen
        setTimeout(function() {
          clearInterval(pollTimer);
          dismissSplash();
        }, 1200);
      })();
    </script>
